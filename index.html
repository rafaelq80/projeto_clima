<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Servidores de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonte do Google - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Previsao do Tempo.">
    <meta name="author" content="Rafael Queiróz">
    <meta name="keywords"
        content="clima, previsão do tempo, Open Meteo, desenvolvimento web, fullstack, HTML, CSS, JavaScript">

    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />

    <title>Previsão do Tempo</title>

    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
    <main class="container">
        <!-- Tela de Busca -->
        <section id="searchScreen">
            <header>
                <h1>Previsão do Tempo</h1>
                <h2>Compare até 5 Cidades</h2>
            </header>

            <form class="search-area" onsubmit="return false;">
                <input type="text" id="cityInput" placeholder="Digite o nome da cidade">
                <button id="addBtn">Adicionar</button>
            </form>

            <section class="messages-area">
                <p id="loading">Carregando...</p>
                <p id="error"></p>
                <p id="success"></p>
            </section>

            <section class="cities-list" id="citiesList"></section>

            <section class="actions" id="actions" style="display: none;">
                <button class="compare-btn" id="compareBtn">Comparar Climas</button>
                <button class="clear-btn" id="clearBtn">Limpar Tudo</button>
            </section>
        </section>

        <!-- Tela de Tabela Comparativa -->
        <section id="tableScreen">
            <header>
                <h1>Comparação de Climas</h1>
            </header>

            <article class="table-container">
                <table id="weatherTable">
                    <thead>
                        <tr>
                            <th>Cidade</th>
                            <th>Clima</th>
                            <th>Temperatura</th>
                            <th>Umidade</th>
                            <th>Vento</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </article>

            <footer class="home-action">
                <button id="backBtn" title="Voltar ao início">
                    <img src="./assets/images/home.svg" alt="Ícone de voltar">
                </button>
            </footer>
        </section>
    </main>

    <script src="./assets/js/api.js"></script>
</body>

</html>
