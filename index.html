<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Servidores de Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Fonte do Google - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Previsao do Tempo.">
    <meta name="author" content="Rafael Queiróz">
    <meta name="keywords"
        content="clima, previsão do tempo, Open Meteo, desenvolvimento web, fullstack, HTML, CSS, JavaScript">

    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />

    <title>Previsão do Tempo</title>

    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>

    <main class="container">

        <h1>Previsão do Tempo</h1>
        
        <!-- Tela de Busca -->
        <section id="searchScreen">
            <form class="search-area" onsubmit="return false;">
                <input type="text" id="cityInput" placeholder="Digite o nome da cidade">
                <button id="searchBtn">Buscar</button>
            </form>

            <p id="loading">Carregando...</p>
            <p id="error"></p>
        </section>

        <!-- Tela de Resultado -->
        <section id="resultScreen">
            <!-- Ícone e Temperatura -->
            <header class="weather-header">
                <i class="weather-icon" id="weatherIcon"></i>
                <p id="temperature"></p>
            </header>

            <!-- Cidade e Data -->
            <article class="weather-info">
                <h2 id="cityName"></h2>
                <p id="description"></p>
                <p id="currentDate"></p>

                <!-- Temperaturas Máxima e Mínima -->
                <section class="temp-range">
                    <article class="temp-item">
                        <span class="temp-label">Máxima</span>
                        <span class="temp-value" id="tempMax"></span>
                    </article>
                    <article class="temp-item">
                        <span class="temp-label">Mínima</span>
                        <span class="temp-value" id="tempMin"></span>
                    </article>
                </section>
            </article>

            <!-- Detalhes Meteorológicos -->
            <section class="weather-details">
                <article class="detail-card">
                    <i class="wi wi-humidity detail-icon"></i>
                    <span class="detail-label">Umidade</span>
                    <span class="detail-value" id="humidity">--</span>
                </article>
                <article class="detail-card">
                    <i class="wi wi-strong-wind detail-icon"></i>
                    <span class="detail-label">Vento</span>
                    <span class="detail-value" id="windSpeed">--</span>
                </article>
                <article class="detail-card">
                    <i class="wi wi-raindrops detail-icon"></i>
                    <span class="detail-label">Precipitação</span>
                    <span class="detail-value" id="precipitation">--</span>
                </article>
            </section>

            <!-- Botão para voltar -->
            <footer>
                 <button id="backBtn" title="Voltar ao início">
                    <img src="./assets/images/home.svg" alt="Ícone de voltar">
                </button>
            </footer>
        </section>
    </main>

    <script src="./assets/js/api.js"></script>
</body>

</html>
