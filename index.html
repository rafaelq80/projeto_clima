<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projeto Previsão do Tempo.">
    <meta name="author" content="Rafael Queiróz">
    <title>Previsão do Tempo</title>

    <link rel="icon" href="./assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
    <div class="container">
        <!-- Tela de Busca -->
        <div id="searchScreen">
            <h1>Previsão do Tempo</h1>

            <div class="search-area">
                <input type="text" id="cityInput" placeholder="Digite o nome da cidade">
                <button id="searchBtn">Buscar</button>
            </div>

            <div id="loading">Carregando...</div>
        </div>

        <!-- Tela de Resultado -->
        <div id="resultScreen">
            <div class="weather-header">
                <p id="temperature"></p>
            </div>

            <div class="weather-info">
                <h2 id="cityName"></h2>
            </div>

            <button id="backBtn" title="Voltar ao início">
                <img src="./assets/images/home.svg" alt="Voltar">
            </button>
        </div>
    </div>

    <script src="./assets/js/api.js"></script>
</body>
</html>
